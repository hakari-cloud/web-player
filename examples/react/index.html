<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>@hakari/player/react — example</title>
  <style>
    html, body { margin: 0; }
    body { background: #0a0a0a; color: #e8eaf0; font-family: system-ui, sans-serif; padding: 24px; max-width: 1100px; margin: 0 auto; }
    h1 { margin: 0 0 16px; font-size: 1.4rem; }
    h2 { margin: 24px 0 8px; font-size: 1.05rem; color: #aab; font-weight: 500; }
    label { display: block; font-size: 0.85rem; color: #aab; margin: 12px 0 4px; }
    input { width: 100%; padding: 8px 10px; background: #15161e; border: 1px solid #2a2c3a; border-radius: 6px; color: #e8eaf0; font-family: ui-monospace, monospace; font-size: 0.78rem; box-sizing: border-box; }
    button { padding: 8px 16px; background: #3BFFD4; color: #07080D; border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button.secondary { background: transparent; color: #3BFFD4; border: 1px solid #3BFFD4; }
    .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
    .player-wrap { aspect-ratio: 16 / 9; margin-top: 16px; border-radius: 8px; overflow: hidden; }
    pre { background: #15161e; border: 1px solid #2a2c3a; border-radius: 6px; padding: 12px; font-size: 11px; white-space: pre-wrap; max-height: 220px; overflow: auto; }
  </style>
</head>
<body>
  <h1>@hakari/player/react</h1>
  <div id="root"></div>

  <script type="module">
    import React from 'react'
    import { createRoot } from 'react-dom/client'
    import { HakariPlayer } from '../../src/react.tsx'

    function App() {
      const [src, setSrc] = React.useState(localStorage.getItem('hakari-player-react-src') || '')
      const [vtt, setVtt] = React.useState(localStorage.getItem('hakari-player-react-vtt') || '')
      const [log, setLog] = React.useState([])
      const ref = React.useRef(null)

      const append = (...a) => setLog((l) => [...l, a.map((x) => typeof x === 'object' ? JSON.stringify(x) : String(x)).join(' ')].slice(-30))

      return React.createElement(React.Fragment, null,
        React.createElement('label', null, 'Playback URL'),
        React.createElement('input', { value: src, onChange: (e) => setSrc(e.target.value), placeholder: 'https://stream.hakari.cloud/.../master.m3u8?token=...' }),
        React.createElement('label', null, 'Thumbnail VTT (optional — VOD only)'),
        React.createElement('input', { value: vtt, onChange: (e) => setVtt(e.target.value), placeholder: 'https://stream.hakari.cloud/vod/<id>/thumbnails.vtt' }),
        React.createElement('div', { className: 'row' },
          React.createElement('button', {
            onClick: () => {
              localStorage.setItem('hakari-player-react-src', src)
              localStorage.setItem('hakari-player-react-vtt', vtt)
              setLog([])
            }
          }, 'Save & remount'),
          React.createElement('button', { className: 'secondary', onClick: () => ref.current?.play() }, 'Play (programmatic)'),
          React.createElement('button', { className: 'secondary', onClick: () => ref.current?.pause() }, 'Pause (programmatic)'),
        ),

        src && React.createElement('h2', null, 'Custom UI player (with scrub thumbnails on hover)'),
        src && React.createElement('div', { className: 'player-wrap' },
          React.createElement(HakariPlayer, {
            key: src + '|' + vtt,
            ref,
            src,
            thumbnailVtt: vtt || undefined,
            autoPlay: false,
            muted: true,
            debug: true,
            accentColor: '#3BFFD4',
            onReady: (e) => append('ready', e),
            onPlaying: () => append('playing'),
            onPause: () => append('pause'),
            onEnded: () => append('ended'),
            onError: (e) => append('error', e),
            onQualityChange: (e) => append('qualitychange', e),
          }),
        ),

        React.createElement('h2', null, 'Event log'),
        React.createElement('pre', null, log.join('\n')),
      )
    }

    createRoot(document.getElementById('root')).render(React.createElement(App))
  </script>
</body>
</html>
